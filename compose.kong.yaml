# Add to compose.yaml and compose.dev.yaml for a local writable Kong Gateway.
services:
  kong-database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: ${KONG_DB_PASSWORD:?required}
    volumes: [kong-db-data:/var/lib/postgresql/data]
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U kong -d kong'], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped
  kong-migrate:
    image: kong:3.9
    command: [/bin/sh, -ec, 'kong migrations bootstrap || (kong migrations up && kong migrations finish)']
    environment: &kong-db-env
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD:?required}
    depends_on: { kong-database: { condition: service_healthy } }
  kong:
    image: kong:3.9
    environment:
      <<: *kong-db-env
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_ERROR_LOG: /dev/stderr
    ports: ['127.0.0.1:58001:8000']
    depends_on: { kong-migrate: { condition: service_completed_successfully } }
    healthcheck: { test: ['CMD', 'kong', 'health'], interval: 10s, timeout: 5s, retries: 15 }
    restart: unless-stopped
  kong-bootstrap:
    build: { context: ., dockerfile: infra/Dockerfile, target: kong-console }
    command: [node, scripts/kong-local-bootstrap.mjs]
    environment:
      KONG_ADMIN_URL: http://kong:8001
      KONG_API_ROUTE_ID: a9fc87a6-e1a8-4ec3-a017-c294c7bfeb39
    depends_on: { kong: { condition: service_healthy } }
  kong-console:
    environment:
      KONG_ADMIN_URL: http://kong:8001
      KONG_API_ROUTE_ID: a9fc87a6-e1a8-4ec3-a017-c294c7bfeb39
    depends_on: { kong-bootstrap: { condition: service_completed_successfully } }
  dashboard:
    environment:
      DASHBOARD_KONG_MOCK: 'false'
      KONG_ADMIN_URL: http://kong:8001
      KONG_API_ROUTE_ID: a9fc87a6-e1a8-4ec3-a017-c294c7bfeb39
    depends_on: { kong-bootstrap: { condition: service_completed_successfully } }
volumes:
  kong-db-data:
