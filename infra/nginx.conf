map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 8080;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $master_backend master:8080;
  set $calls_backend calls:5030;
  root /usr/share/nginx/html;
  client_max_body_size 11m;
  add_header Referrer-Policy no-referrer always;
  add_header X-Content-Type-Options nosniff always;
  location /internal/ { return 404; }
  location /api/v1/ {
    proxy_set_header X-Gateway-Secret "";
    proxy_set_header X-Internal-Secret "";
    proxy_intercept_errors on;
    error_page 502 503 504 = @api_unavailable;
    proxy_pass http://$master_backend$request_uri;
  }
  location ~ ^/(api/v2|v1)/ {
    proxy_set_header X-Gateway-Secret "";
    proxy_set_header X-Internal-Secret "";
    proxy_intercept_errors on;
    error_page 502 503 504 = @api_unavailable;
    proxy_pass http://$calls_backend$request_uri;
  }
  location @api_unavailable {
    default_type application/json;
    return 503 '{"success":false,"error":{"code":"SERVICE_UNAVAILABLE","message":"Layanan sementara tidak tersedia. Coba lagi."}}';
  }
  location /socket.io/ {
    proxy_pass http://$calls_backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 75s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
