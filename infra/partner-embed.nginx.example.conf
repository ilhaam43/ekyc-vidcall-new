# Include inside the partner's HTTPS staff-site server block. The frontend
# container is reachable only on a private network. Start the optional
# embedded-frontend Compose profile; the basic frontend remains at /.
location ^~ /ekyc-agent/ {
    proxy_pass http://embedded-frontend:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Gateway-Secret "";
    proxy_set_header X-Internal-Secret "";
    proxy_cookie_path / /ekyc-agent/;
    proxy_read_timeout 75s;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
}

# Include inside the partner's separate HTTPS customer-site server block.
# It forwards only the public session/call APIs and Socket.IO; no agent UI.
location ^~ /ekyc-api/api/ {
    proxy_pass http://ekyc-frontend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Gateway-Secret "";
    proxy_set_header X-Internal-Secret "";
    proxy_cookie_path / /ekyc-api/;
    add_header Cache-Control "no-store" always;
}
location ^~ /ekyc-api/socket.io/ {
    proxy_pass http://ekyc-frontend:8080/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Gateway-Secret "";
    proxy_set_header X-Internal-Secret "";
    proxy_read_timeout 75s;
}
