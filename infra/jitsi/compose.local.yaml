# Docker Desktop localhost smoke test. One Jibri runs; the five-slot Linux pilot uses compose.pilot.yaml alone.
services:
  media-proxy:
    image: node:24-bookworm-slim
    entrypoint: [node, -e]
    environment:
      JITSI_PROXY_PORT: ${HTTPS_PORT:-9443}
    command:
      - "const net=require('node:net');net.createServer(client=>{const target=net.connect(8443,'web');client.pipe(target);target.pipe(client);client.on('error',()=>target.destroy());target.on('error',()=>client.destroy())}).listen(Number(process.env.JITSI_PROXY_PORT.split(':').at(-1)),'0.0.0.0')"
    depends_on: [web]
    networks:
      meet.jitsi:
        aliases: [meet.localtest.me]
  calls:
    environment:
      RECORDING_SLOTS: 1
  jvb:
    environment:
      # Chrome needs a reachable host/LAN candidate (not loopback). Keep the
      # container candidate for Jibri; update this when the host address changes.
      JVB_ADVERTISE_IPS: ${JVB_LOCAL_ADVERTISE_IPS:?Set the current Docker Desktop host IPv4 address}
      JVB_ADVERTISE_PRIVATE_CANDIDATES: 'true'
  jibri1:
    environment:
      IGNORE_CERTIFICATE_ERRORS: '1'
  jibri2:
    profiles: [pilot-only]
  jibri3:
    profiles: [pilot-only]
  jibri4:
    profiles: [pilot-only]
  jibri5:
    profiles: [pilot-only]
