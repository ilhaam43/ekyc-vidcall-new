services:
  postgres:
    ports: ['127.0.0.1:55432:5432']
  valkey:
    ports: ['127.0.0.1:56379:6379']
  storage:
    ports: ['127.0.0.1:58333:8333']
  master:
    ports: ['127.0.0.1:58080:8080']
  calls:
    ports: ['127.0.0.1:55030:5030']
  embedded-demo:
    build: { context: ., dockerfile: infra/Dockerfile, target: backend }
    command: [node, scripts/embedded-demo-service.mjs]
    environment:
      NODE_ENV: development
      TZ: ${TZ:-Asia/Jakarta}
      DATABASE_URL: postgres://ekyc:${POSTGRES_PASSWORD:?required}@postgres:5432/ekyc
      CALLS_URL: http://calls:5030
      EMBEDDED_DEMO_FRONTEND_URL: http://127.0.0.1:5173
      EMBEDDED_DEMO_HOST: 0.0.0.0
      EMBEDDED_DEMO_PORT: 5174
    ports: ['127.0.0.1:5174:5174']
    depends_on: { calls: { condition: service_healthy }, frontend: { condition: service_started } }
    healthcheck: { test: ['CMD', 'node', '-e', "fetch('http://localhost:5174/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 10 }
    restart: unless-stopped
  storage-ui:
    ports: ['127.0.0.1:58082:8080']
  dashboard:
    ports: ['127.0.0.1:5301:5301']
    environment:
      DASHBOARD_MOCK_EXTERNALS: 'true'
      KONG_TRUST_CONSUMER_HEADER: 'true'
  dashboard-worker:
    environment:
      DASHBOARD_MOCK_EXTERNALS: 'true'
  kong-console:
    ports: ['127.0.0.1:5302:5302']
